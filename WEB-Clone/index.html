<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flipkart Clone - Home</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Header -->
  <header class="topbar">
    <div class="logo">FLIPKART</div>
    <div class="search">
      <input id="searchInput" placeholder="Search for products, brands and more" />
      <button id="searchBtn">Search</button>
    </div>
    <div class="actions">
      <a href="login.html" class="btn">Login</a>
      <a href="cart.html" class="btn">Cart (<span id="cartCount">0</span>)</a>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="categories">
    <a href="index.html">Home</a>
    <a href="#">Electronics</a>
    <a href="#">Fashion</a>
    <a href="#">Home</a>
    <a href="#">Appliances</a>
    <a href="#">More</a>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-left">
      <h1>Big Savings | Top Brands</h1>
      <p>Shop from wide range of products — electronics, fashion, home and more.</p>
      <button onclick="scrollToProducts()">Shop Now</button>
    </div>
    <div class="hero-right">
      <img src="images/flp.jpg" alt="banner" />
    </div>
  </section>

  <!-- Products -->
  <main>
    <h2>Featured Products</h2>
    <section class="product-grid" id="productGrid"></section>
  </main>

  <template id="productCard">
    <div class="card">
      <img class="p-img" src="" alt="product" />
      <div class="p-info">
        <h3 class="p-title"></h3>
        <p class="p-price"></p>
        <div class="p-meta">
          <span class="p-rating"></span>
          <button class="add-btn">Add to Cart</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Footer -->
  <footer>
    <p>Designed by <strong>Luxciya G</strong> | Flipkart-like Webpage Project</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
